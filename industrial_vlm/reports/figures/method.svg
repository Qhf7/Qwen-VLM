    <text style="fill: #253448; font: 10px 'DejaVu Sans'" transform="translate(470.400375 80.836703)">Train annotations only</text>
    <text style="fill: #253448; font: 10px 'DejaVu Sans'" transform="translate(466.85975 94.314047)">Mask → union-box JSON</text>
   </g>
   <g id="text_5">
