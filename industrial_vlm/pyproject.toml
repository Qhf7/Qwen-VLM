[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-vlm"
version = "0.1.0"
description = "Single-image Qwen3-VL QLoRA for industrial anomaly decisions and boxes"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "transformers>=4.57.0",
  "peft>=0.17.0",
  "accelerate>=1.0",
  "bitsandbytes==0.48.2",
  "Pillow>=10",
  "numpy>=1.26",
  "safetensors>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
