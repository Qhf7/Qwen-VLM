# Protocol C：未见零件类别（四折，每折 18 训练类 / 6 测试类）
# 用途：cross-part-category —— 整类没见过的零件能不能分割（论文主证据）
# 必须配 --fold 0..3 使用；test 只含该折的 6 个 holdout 类
protocol:
  name: protocol_c_unseen_category
  type: c                     # a | b | c
  split_dir: artifacts/splits   # 复用已冻结的划分
  split_prefix: protocol_c     # type=c 时走 protocol_c_fold{fold}/ 目录
  fold: null                   # 必填，由 --fold 覆盖

input:
  image_size: 448
  num_workers: 8

model:
  hidden: 256
  arm: a0                     # a0=dino only；后续 a1=+vlm 视觉，a2=+vlm 语言，a3=两者

train:
  seed: 20261020
  batch: 8
  eval_batch: 8
  lr: 0.001
  weight_decay: 0.0001
  max_steps: 6000
  warmup_steps: 100
  grad_clip: 1.0
  log_every: 50
  eval_steps: [1000, 2000, 3000, 4000, 5000, 6000]

data:
  source_root: Dataset
