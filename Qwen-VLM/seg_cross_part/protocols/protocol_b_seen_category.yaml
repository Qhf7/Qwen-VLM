# Protocol B：同类新零件（24 类，类内按 visual_group_id 70/15/15）
# 用途：seen-class / unseen-instance —— 同一批零件类别里的新零件能不能分割
protocol:
  name: protocol_b_seen_category
  type: b                     # a | b | c
  split_dir: artifacts/splits   # 复用已冻结的划分
  split_prefix: protocol_b
  fold: null

input:
  image_size: 448
  num_workers: 8

model:
  hidden: 256
  arm: a0                     # a0=dino only；后续 a1=+vlm 视觉，a2=+vlm 语言，a3=两者

train:
  seed: 20261020
  batch: 8
  eval_batch: 8
  lr: 0.001
  weight_decay: 0.0001
  max_steps: 6000
  warmup_steps: 100
  grad_clip: 1.0
  log_every: 50
  eval_steps: [1000, 2000, 3000, 4000, 5000, 6000]

data:
  source_root: Dataset
