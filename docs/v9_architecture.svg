<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Best Hybrid VLM v9 architecture</title>
  <desc id="desc">DINOv2 dense anomaly localization with bounded Qwen3-VL local semantic residual.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#40566f"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #17212b; }
      .label { font: 600 18px sans-serif; fill: #17212b; }
      .small { font: 15px sans-serif; fill: #40566f; }
      .box { stroke: #40566f; stroke-width: 2; rx: 10; }
      .train { fill: #e8f1fb; }
      .branch { fill: #eef7ed; }
      .vlm { fill: #fff4db; }
      .output { fill: #f5eafa; }
      .arrow { stroke: #40566f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1600" height="950" fill="#ffffff"/>
  <text x="800" y="42" text-anchor="middle" class="title">Best Hybrid VLM v9</text>
  <text x="800" y="70" text-anchor="middle" class="small">DINOv2-first dense localization + bounded local Qwen3-VL evidence</text>

  <rect x="40" y="105" width="210" height="100" class="box train"/>
  <text x="145" y="140" text-anchor="middle" class="label">Official Train</text>
  <text x="145" y="168" text-anchor="middle" class="small">normal 5-view images</text>
  <text x="145" y="190" text-anchor="middle" class="small">pseudo anomaly source</text>

  <rect x="300" y="105" width="250" height="100" class="box train"/>
  <text x="425" y="140" text-anchor="middle" class="label">Frozen DINOv2</text>
  <text x="425" y="168" text-anchor="middle" class="small">ViT-B/14, 1036 + 518</text>
  <text x="425" y="190" text-anchor="middle" class="small">multi-layer patch features</text>
  <path d="M250 155 H300" class="arrow"/>

  <rect x="600" y="95" width="230" height="85" class="box branch"/>
  <text x="715" y="128" text-anchor="middle" class="label">Reconstruction</text>
  <text x="715" y="156" text-anchor="middle" class="small">normal manifold distance</text>
  <path d="M550 130 H600" class="arrow"/>

  <rect x="600" y="205" width="230" height="85" class="box branch"/>
  <text x="715" y="238" text-anchor="middle" class="label">Memory banks</text>
  <text x="715" y="266" text-anchor="middle" class="small">category/view + global kNN</text>
  <path d="M550 155 C570 155 570 245 600 245" class="arrow"/>

  <rect x="600" y="315" width="230" height="85" class="box branch"/>
  <text x="715" y="348" text-anchor="middle" class="label">Pseudo pixel head</text>
  <text x="715" y="376" text-anchor="middle" class="small">defect + hard-normal loss</text>
  <path d="M550 180 C570 180 570 355 600 355" class="arrow"/>

  <rect x="40" y="290" width="210" height="130" class="box train"/>
  <text x="145" y="325" text-anchor="middle" class="label">Train supervision</text>
  <text x="145" y="353" text-anchor="middle" class="small">microcrack</text>
  <text x="145" y="375" text-anchor="middle" class="small">low-contrast stain</text>
  <text x="145" y="397" text-anchor="middle" class="small">edge / highlight / texture</text>
  <path d="M250 350 H530 C570 350 570 355 600 355" class="arrow dashed"/>

  <rect x="900" y="175" width="250" height="150" class="box branch"/>
  <text x="1025" y="210" text-anchor="middle" class="label">Train-only calibration</text>
  <text x="1025" y="240" text-anchor="middle" class="small">category-stratified</text>
  <text x="1025" y="264" text-anchor="middle" class="small">90 / 99.9 pixel bounds</text>
  <text x="1025" y="288" text-anchor="middle" class="small">50 / 99 image bounds</text>
  <path d="M830 138 H900" class="arrow"/>
  <path d="M830 248 H900" class="arrow"/>
  <path d="M830 358 C860 358 860 300 900 300" class="arrow"/>

  <rect x="1220" y="175" width="250" height="150" class="box output"/>
  <text x="1345" y="210" text-anchor="middle" class="label">DINO dense control</text>
  <text x="1345" y="240" text-anchor="middle" class="small">multi-scale fusion</text>
  <text x="1345" y="264" text-anchor="middle" class="small">continuous anomaly map</text>
  <text x="1345" y="288" text-anchor="middle" class="small">image score + 448 mask</text>
  <path d="M1150 250 H1220" class="arrow"/>

  <rect x="40" y="570" width="210" height="100" class="box train"/>
  <text x="145" y="605" text-anchor="middle" class="label">Test_A images</text>
  <text x="145" y="633" text-anchor="middle" class="small">five views + local crops</text>
  <text x="145" y="655" text-anchor="middle" class="small">no test labels</text>

  <rect x="300" y="570" width="250" height="100" class="box vlm"/>
  <text x="425" y="605" text-anchor="middle" class="label">Local Qwen3-VL</text>
  <text x="425" y="633" text-anchor="middle" class="small">structured crop audit</text>
  <text x="425" y="655" text-anchor="middle" class="small">local inference only</text>
  <path d="M250 620 H300" class="arrow"/>

  <rect x="600" y="530" width="250" height="180" class="box vlm"/>
  <text x="725" y="565" text-anchor="middle" class="label">Semantic evidence</text>
  <text x="725" y="595" text-anchor="middle" class="small">is_anomaly + score tier</text>
  <text x="725" y="619" text-anchor="middle" class="small">reason + defect type</text>
  <text x="725" y="643" text-anchor="middle" class="small">compact box area</text>
  <text x="725" y="667" text-anchor="middle" class="small">crop + five-view agreement</text>
  <path d="M550 620 H600" class="arrow"/>

  <rect x="900" y="560" width="250" height="120" class="box vlm"/>
  <text x="1025" y="598" text-anchor="middle" class="label">DINO support gate</text>
  <text x="1025" y="628" text-anchor="middle" class="small">semantic evidence only where</text>
  <text x="1025" y="652" text-anchor="middle" class="small">DINO dense response exists</text>
  <path d="M850 620 H900" class="arrow"/>
  <path d="M1345 325 C1345 430 1025 430 1025 560" class="arrow dashed"/>

  <rect x="1220" y="535" width="250" height="150" class="box output"/>
  <text x="1345" y="570" text-anchor="middle" class="label">Bounded VLM residual</text>
  <text x="1345" y="600" text-anchor="middle" class="small">max pixel residual 0.12</text>
  <text x="1345" y="624" text-anchor="middle" class="small">box never becomes mask</text>
  <text x="1345" y="648" text-anchor="middle" class="small">DINO + semantic evidence</text>
  <path d="M1150 620 H1220" class="arrow"/>

  <rect x="540" y="795" width="260" height="85" class="box output"/>
  <text x="670" y="828" text-anchor="middle" class="label">submission_v9_dense.zip</text>
  <text x="670" y="856" text-anchor="middle" class="small">control / ablation</text>
  <path d="M1345 325 C1345 760 800 760 800 795" class="arrow"/>

  <rect x="840" y="795" width="260" height="85" class="box output"/>
  <text x="970" y="828" text-anchor="middle" class="label">submission_v9_hybrid.zip</text>
  <text x="970" y="856" text-anchor="middle" class="small">DINO + bounded VLM</text>
  <path d="M1345 685 C1345 760 1100 760 1100 795" class="arrow"/>

  <text x="800" y="920" text-anchor="middle" class="small">All outputs: submission.csv + 5 x 448x448 grayscale masks per group</text>
</svg>
