<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Best Hybrid VLM v9 architecture</title>
  <desc id="desc">A publication-style architecture diagram showing train-only normal modeling with DINOv2 and test-time zero-shot inference with local Qwen3-VL bounded by dense DINO support.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#46779F"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3D806F"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B87916"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#76528A"/></marker>
    <style>
      .title{font:700 26px Arial,sans-serif;fill:#17212B}.subtitle{font:14px Arial,sans-serif;fill:#52606D}
      .section{font:700 17px Arial,sans-serif}.label{font:700 13px Arial,sans-serif;fill:#17212B}.body{font:12px Arial,sans-serif;fill:#17212B}.small{font:11px Arial,sans-serif;fill:#52606D}
      .card{stroke-width:2}.blue{fill:#E7F0FA;stroke:#46779F}.teal{fill:#EAF6F1;stroke:#3D806F}.gray{fill:#F2F4F7;stroke:#697586}.orange{fill:#FFF1D6;stroke:#B87916}.orange2{fill:#FFF7E8;stroke:#B87916}.purple{fill:#F0E8F7;stroke:#76528A}
      .flow-blue{fill:none;stroke:#46779F;stroke-width:2;marker-end:url(#arrow-blue)}.flow-teal{fill:none;stroke:#3D806F;stroke-width:2;marker-end:url(#arrow-teal)}.flow-gray{fill:none;stroke:#697586;stroke-width:2;marker-end:url(#arrow-teal)}.flow-orange{fill:none;stroke:#B87916;stroke-width:2;marker-end:url(#arrow-orange)}.flow-purple{fill:none;stroke:#76528A;stroke-width:2;marker-end:url(#arrow-purple)}
    </style>
  </defs>
  <rect width="1800" height="1000" fill="#FFFFFF"/>
  <text x="50" y="50" class="title">Best Hybrid VLM v9: Zero-Shot Industrial Anomaly Detection</text>
  <text x="52" y="82" class="subtitle">DINOv2 dense localization is the spatial anchor; local Qwen3-VL evidence provides a bounded semantic residual.</text>
  <text x="50" y="132" class="section" fill="#1D4E89">(a) TRAIN-ONLY NORMAL MODELING</text>
  <text x="990" y="132" class="section" fill="#8A5A00">(b) TEST-TIME ZERO-SHOT INFERENCE</text>
  <path d="M900 112 V892" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>

  <g class="card blue"><rect x="50" y="165" width="190" height="86" rx="12" class="card blue"/><text x="145" y="196" text-anchor="middle" class="label">Official Train</text><text x="145" y="220" text-anchor="middle" class="body">normal images · five fixed views</text></g>
  <g class="card blue"><rect x="50" y="300" width="190" height="92" rx="12" class="card blue"/><text x="145" y="330" text-anchor="middle" class="label">Procedural pseudo anomalies</text><text x="145" y="353" text-anchor="middle" class="body">scratch · crack · chip · dent</text><text x="145" y="374" text-anchor="middle" class="body">microcrack · low-contrast stain</text></g>
  <g class="card gray"><rect x="50" y="445" width="190" height="92" rx="12" class="card gray"/><text x="145" y="475" text-anchor="middle" class="label">Hard-normal negatives</text><text x="145" y="498" text-anchor="middle" class="body">background · contour · highlight</text><text x="145" y="519" text-anchor="middle" class="body">strong/repetitive texture</text></g>
  <g class="card teal"><rect x="300" y="300" width="220" height="104" rx="12" class="card teal"/><text x="410" y="334" text-anchor="middle" class="label">Frozen DINOv2 ViT-B/14</text><text x="410" y="358" text-anchor="middle" class="body">multi-layer patch features</text><text x="410" y="380" text-anchor="middle" class="body">1036 px + 518 px views</text></g>
  <g class="card teal"><rect x="590" y="300" width="220" height="104" rx="12" class="card teal"/><text x="700" y="334" text-anchor="middle" class="label">Dense feature field</text><text x="700" y="358" text-anchor="middle" class="body">shallow texture + mid-level structure</text><text x="700" y="380" text-anchor="middle" class="body">+ deep semantic features</text></g>
  <g class="card teal"><rect x="300" y="510" width="220" height="76" rx="12" class="card teal"/><text x="410" y="541" text-anchor="middle" class="label">Reconstruction branch</text><text x="410" y="564" text-anchor="middle" class="body">normal-manifold distance</text></g>
  <g class="card teal"><rect x="590" y="510" width="220" height="76" rx="12" class="card teal"/><text x="700" y="541" text-anchor="middle" class="label">Category / view memory bank</text><text x="700" y="564" text-anchor="middle" class="body">global bank + kNN retrieval</text></g>
  <g class="card teal"><rect x="590" y="650" width="220" height="76" rx="12" class="card teal"/><text x="700" y="681" text-anchor="middle" class="label">Pseudo-anomaly pixel head</text><text x="700" y="704" text-anchor="middle" class="body">BCE + Tversky + hard negatives</text></g>
  <g class="card gray"><rect x="300" y="770" width="510" height="88" rx="12" class="card gray"/><text x="555" y="802" text-anchor="middle" class="label">Train-only calibration</text><text x="555" y="826" text-anchor="middle" class="body">category-stratified normal bounds · pixel 90/99.9 · image 50/99</text></g>
  <g class="card blue"><rect x="50" y="650" width="430" height="76" rx="12" class="card blue"/><text x="265" y="681" text-anchor="middle" class="label">Learned normal model</text><text x="265" y="704" text-anchor="middle" class="body">DINO dense response + calibrated thresholds</text></g>

  <g class="card orange"><rect x="990" y="165" width="200" height="86" rx="12" class="card orange"/><text x="1090" y="196" text-anchor="middle" class="label">Test A / B input</text><text x="1090" y="220" text-anchor="middle" class="body">five-view product images</text><text x="1090" y="239" text-anchor="middle" class="body">unseen-category capable</text></g>
  <g class="card orange"><rect x="1260" y="165" width="240" height="86" rx="12" class="card orange"/><text x="1380" y="196" text-anchor="middle" class="label">Local Qwen3-VL audit</text><text x="1380" y="220" text-anchor="middle" class="body">crop-level structured reasoning</text><text x="1380" y="239" text-anchor="middle" class="body">no online API / no test labels</text></g>
  <g class="card teal"><rect x="990" y="315" width="200" height="76" rx="12" class="card teal"/><text x="1090" y="346" text-anchor="middle" class="label">DINO dense response</text><text x="1090" y="369" text-anchor="middle" class="body">multi-scale patch anomaly field</text></g>
  <g class="card orange2"><rect x="1260" y="315" width="240" height="104" rx="12" class="card orange2"/><text x="1380" y="347" text-anchor="middle" class="label">Semantic evidence</text><text x="1380" y="370" text-anchor="middle" class="body">is_anomaly + score tier</text><text x="1380" y="391" text-anchor="middle" class="body">reason/type + box area</text><text x="1380" y="412" text-anchor="middle" class="body">crop agreement + five-view count</text></g>
  <g class="card teal"><rect x="990" y="510" width="200" height="90" rx="12" class="card teal"/><text x="1090" y="543" text-anchor="middle" class="label">DINO support gate</text><text x="1090" y="566" text-anchor="middle" class="body">semantic evidence can enhance</text><text x="1090" y="587" text-anchor="middle" class="body">only supported dense response</text></g>
  <g class="card orange2"><rect x="1260" y="510" width="240" height="90" rx="12" class="card orange2"/><text x="1380" y="543" text-anchor="middle" class="label">Bounded VLM residual</text><text x="1380" y="566" text-anchor="middle" class="body">local evidence → ΔM ≤ 0.12</text><text x="1380" y="587" text-anchor="middle" class="body">box is not rasterized as mask</text></g>
  <g class="card purple"><rect x="1260" y="680" width="240" height="92" rx="12" class="card purple"/><text x="1380" y="713" text-anchor="middle" class="label">Hybrid fusion</text><text x="1380" y="737" text-anchor="middle" class="body">DINO dense control + aligned VLM residual</text><text x="1380" y="758" text-anchor="middle" class="body">image score + 448×448 mask</text></g>
  <g class="card purple"><rect x="990" y="835" width="510" height="90" rx="12" class="card purple"/><text x="1245" y="868" text-anchor="middle" class="label">SUBMISSION OUTPUT</text><text x="1245" y="892" text-anchor="middle" class="body">submission.csv + five grayscale masks per group</text><text x="1245" y="913" text-anchor="middle" class="body">mask background = 0 · anomaly intensity = calibrated score</text></g>

  <path class="flow-blue" d="M240 208 H270 V352 H300"/><path class="flow-blue" d="M240 346 H300"/><path class="flow-gray" d="M240 491 H270 V404 H300"/><path class="flow-teal" d="M520 352 H590"/><path class="flow-teal" d="M700 404 V455 H410 V510"/><path class="flow-teal" d="M700 404 V510"/>
  <path class="flow-blue" d="M240 346 H260 V280 H530 V688 H590"/><path class="flow-gray" d="M240 491 H530 V710 H590"/><path class="flow-teal" d="M410 586 V620 H540 V750 H520 V770"/><path class="flow-teal" d="M810 548 H840 V742 H760 V770"/><path class="flow-teal" d="M700 726 V770"/><path class="flow-blue" d="M300 814 H270 V688 H480"/>
  <path class="flow-orange" d="M1190 208 H1260"/><path class="flow-teal" d="M1090 251 V315"/><path class="flow-orange" d="M1380 251 V315"/><path class="flow-teal" d="M1090 391 V510"/><path class="flow-orange" d="M1380 419 V510"/><path class="flow-teal" d="M1190 555 H1260"/><path class="flow-purple" d="M1380 600 V680"/><path class="flow-blue" d="M480 688 H500 V620 H850 V555 H990"/><path class="flow-purple" d="M1380 772 V810 H1245 V835"/>

  <text x="1540" y="165" class="small" font-weight="700">Legend</text>
  <rect x="1540" y="180" width="112" height="30" rx="7" class="card blue"/><text x="1596" y="200" text-anchor="middle" class="small">data / features</text>
  <rect x="1668" y="180" width="112" height="30" rx="7" class="card orange"/><text x="1724" y="200" text-anchor="middle" class="small">VLM evidence</text>
  <rect x="1540" y="222" width="112" height="30" rx="7" class="card teal"/><text x="1596" y="242" text-anchor="middle" class="small">learned module</text>
  <rect x="1668" y="222" width="112" height="30" rx="7" class="card purple"/><text x="1724" y="242" text-anchor="middle" class="small">output</text>
</svg>
